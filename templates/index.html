<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minería de Datos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background: #f4f6f9;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #4e54c8, #8f94fb);
            color: white;
            padding: 20px;
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h2 {
            display: flex;
            justify-content: center;
        }

        .title-pill {
            display: inline-block;
            background: linear-gradient(90deg, #a977f0, #cbb4e9);
            color: #1a1a1a;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .title-pill:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 15px rgba(0,0,0,0.2);
        }

        .menu button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu button:hover {
            background: white;
            color: #4e54c8;
            transform: scale(1.05);
        }

        /* NOMBRES ABAJO */
        .footer {
            font-size: 13px;
            text-align: left;
            opacity: 0.9;
            padding-left: 10px;
        }

        /* CONTENIDO */
        .content {
            margin-left: 270px;
            padding: 30px;
            width: 100%;
        }

        h1 {
            color: #4e54c8;
            margin-bottom: 15px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        h3 {
            color: #4e54c8;
            margin-bottom: 10px;
        }

        p, li {
            color: #555;
            line-height: 1.6;
        }

        ul {
            margin-left: 20px;
        }

        a {
            color: #4e54c8;
            text-decoration: none;
            font-weight: bold;
        }

        /* TARJETAS */
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
        }

        /* OCULTAR SECCIONES */
        .section {
            display: none;
        }

        .active {
            display: block;
        }

    </style>
</head>
